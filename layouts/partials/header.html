<nav class="navbar navbar-expand-lg navbar-light" role="navigation" aria-label="Main navigation">
    <div class="container-fluid">
        {{/* Hamburger toggle button */}}
        <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        {{/* Collapsible navigation */}}
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {{- range site.Menus.main }}
                <li class="nav-item">
                    {{- if .Params.button }}
                    <a class="nav-link nav-button" href="{{ .Params.href | default .URL }}" target="_blank" rel="noopener">
                        {{ .Name }}<span class="visually-hidden"> (PDF, opens in new tab)</span>
                    </a>
                    {{- else }}
                    <a class="nav-link" href="{{ .URL }}"{{ if eq $.Page.RelPermalink .URL }} aria-current="page"{{ end }}>
                        {{ .Name }}
                    </a>
                    {{- end }}
                </li>
                {{- end }}
            </ul>
        </div>
    </div>
</nav>
